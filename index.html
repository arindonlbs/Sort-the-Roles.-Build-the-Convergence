<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f15b59">
<title>Sort the Roles – Build the Convergence</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#102f40;font-family:Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
#app{position:relative;width:min(100vw,56.25vh);height:min(177.7778vw,100vh);aspect-ratio:9/16;overflow:hidden;background:#fff;box-shadow:0 0 28px #0005}
.screen{position:absolute;inset:0;display:none;overflow:hidden}.screen.active{display:block}
.full-art{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}
.action-img{position:absolute;width:34%;height:auto;object-fit:contain;cursor:pointer;z-index:5; -webkit-tap-highlight-color:transparent;filter:drop-shadow(0 3px 2px #0002);transition:transform .11s ease,filter .11s ease}
.action-img:active,.dept-btn:active{transform:translateY(5px) scale(.96);filter:brightness(.94)}
#introNext{left:33%;bottom:5.5%}
#startBtn{left:33%;bottom:5.5%;z-index:5}
#instructionVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#102f40;z-index:2}
#gameTemplate{z-index:3}
#pictureWindow{position:absolute;z-index:2;left:16.15%;top:21.82%;width:67.7%;height:24.42%;display:flex;align-items:center;justify-content:center;overflow:hidden}
#questionImage{width:100%;height:100%;object-fit:contain;display:block}
#hud{position:absolute;z-index:5;top:5.2%;left:8%;width:84%;display:flex;justify-content:space-between;align-items:center;color:white;font-weight:800;font-size:clamp(12px,3.3vw,19px);text-shadow:0 1px 2px #923}
#indicators{position:absolute;z-index:5;left:25.5%;top:17.15%;width:49%;display:flex;justify-content:space-between;gap:0;height:1.7%}
 .indicator{height:100%;width:37.5%;flex:0 0 37.5%;background:#b9b9b9;border-radius:99px;box-shadow:inset 0 1px 2px #7778;transition:background .15s}
.indicator.good.on{background:#45bd45}.indicator.bad.on{background:#e64b43}
#deptButtons{position:absolute;z-index:6;left:4%;right:4%;top:76.5%;height:9.5%;display:flex;justify-content:space-between;align-items:center}
.dept-btn{border:0;background:transparent;padding:0;width:31%;height:100%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .12s ease; -webkit-tap-highlight-color:transparent}
.dept-btn img{width:46%;height:92%;object-fit:contain;filter:drop-shadow(0 2px 1px #0002);transition:filter .12s}
.dept-btn:focus-visible{outline:3px solid #fff;outline-offset:2px;border-radius:14px}
.dept-btn:active img{filter:brightness(.9)}
#feedback{position:absolute;z-index:7;left:2%;right:2%;top:52%;text-align:center;font-weight:900;font-size:clamp(22px,6vw,32px);line-height:1.15;letter-spacing:.2px;color:#fff;text-shadow:0 2px 4px #000b;pointer-events:none}
#endScore{position:absolute;z-index:4;top:48%;left:0;width:100%;text-align:center;font-weight:800;color:#fff;font-size:clamp(23px,7vw,38px);text-shadow:0 2px 3px #9a3333}
#replayBtn{position:absolute;z-index:5;right:9%;top:56.5%;width:22%;cursor:pointer;transition:transform .12s}
#replayBtn:active{transform:translateY(5px) scale(.94)}
#soundHint{position:absolute;z-index:9;bottom:1%;left:0;right:0;text-align:center;font-size:10px;color:#fff9;pointer-events:none}
@media (min-width:600px){#app{border-radius:8px}}
</style>
</head>
<body>
<div id="app">
 <section id="intro" class="screen active">
  <img class="full-art" src="01_Intro/Game 2 template-01.png">
  <img id="introNext" class="action-img" src="05_Buttons/Next.png" alt="Next" role="button" tabindex="0">
 </section>
 <section id="instructions" class="screen">
  <img class="full-art" src="08_Base/Base.png">
  <video id="instructionVideo" src="02_Instruction/Instruction Page.mp4" autoplay muted playsinline preload="auto"></video>
  <img id="startBtn" class="action-img" src="05_Buttons/Start.png" alt="Start" role="button" tabindex="0">
 </section>
 <section id="game" class="screen">
  <img class="full-art" src="08_Base/Base.png">
  <div id="pictureWindow"><img id="questionImage" alt="Identify the department"></div>
  <img id="gameTemplate" class="full-art" src="04_Gameplay page/Game 2 template_Artboard 3-03.png">
  <div id="hud"><span id="scoreText">Score: 0</span><span id="progressText">1 / 15</span></div>
  <div id="indicators"><div id="correctLight" class="indicator good"></div><div id="wrongLight" class="indicator bad"></div></div>
  <div id="feedback" aria-live="polite"></div>
  <div id="deptButtons">
   <button class="dept-btn" data-dept="ULB" aria-label="ULB"><img src="05_Buttons/Button ULb.png" alt="ULB"></button>
   <button class="dept-btn" data-dept="Medical Department" aria-label="Medical Department"><img src="05_Buttons/Button Health Department.png" alt="Medical Department"></button>
   <button class="dept-btn" data-dept="Coordination" aria-label="Coordination"><img src="05_Buttons/Button Coordinationpng.png" alt="Coordination"></button>
  </div>
 </section>
 <section id="end" class="screen">
  <img class="full-art" src="07_End_Screen/Game 2 template_Artboard 4-04.png">
  <div id="endScore">0 / 15</div>
  <img id="replayBtn" src="05_Buttons/Replay.png" alt="Replay" role="button" tabindex="0">
 </section>
 <audio id="bgm" src="09_Audio/leberch-soft-piano-589658.mp3" loop preload="auto"></audio>
</div>
<script>
const $=s=>document.querySelector(s);
const screens={intro:$('#intro'),instructions:$('#instructions'),game:$('#game'),end:$('#end')};
const files=[
'03_Images/ULB_1.png','03_Images/ULB_2.png','03_Images/ULB_3.png','03_Images/ULB_4.png','03_Images/ULB_5.png',
'03_Images/Medical Department_1.png','03_Images/Medical Department_2.png','03_Images/Medical Department_3.png','03_Images/Medical Department_4.png','03_Images/Medical Department_5.png',
'03_Images/Coordination_1.png','03_Images/Coordination_2.png','03_Images/Coordination_3.png','03_Images/Coordination_4.png','03_Images/Coordination_5.png'
];
let deck=[],index=0,score=0,attempts=0,locked=false,wrongTimer=null,advanceTimer=null;
function show(name){Object.values(screens).forEach(x=>x.classList.remove('active'));screens[name].classList.add('active')}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function department(path){let f=path.split('/').pop();return f.startsWith('ULB_')?'ULB':f.startsWith('Medical Department_')?'Medical Department':'Coordination'}
function setLights(good,bad){$('#correctLight').classList.toggle('on',good);$('#wrongLight').classList.toggle('on',bad)}
function updateHud(){$('#scoreText').textContent='Score: '+score;$('#progressText').textContent=(index+1)+' / '+deck.length}
function loadQuestion(){if(wrongTimer)clearTimeout(wrongTimer);if(advanceTimer)clearTimeout(advanceTimer);wrongTimer=null;advanceTimer=null;attempts=0;locked=false;setLights(false,false);$('#feedback').textContent='';$('#questionImage').src=deck[index];updateHud()}
function nextQuestion(){index++;if(index>=deck.length){$('#endScore').textContent=score+' / '+deck.length;show('end');return}loadQuestion()}
function answer(choice){
 if(locked)return;
 if(wrongTimer){clearTimeout(wrongTimer);wrongTimer=null;}
 if(advanceTimer){clearTimeout(advanceTimer);advanceTimer=null;}
 const right=department(deck[index]);
 if(choice===right){
   locked=true;
   setLights(true,false);
   if(attempts===0)score++;
   updateHud();
   $('#feedback').textContent='Correct!';
   // Briefly show the result, then move on without an unnecessary pause.
   advanceTimer=setTimeout(nextQuestion,650);
 }else{
   attempts++;
   setLights(false,true);
   if(attempts===1){
     $('#feedback').textContent='Try again!';
     // Keep the first-wrong indicator visible for up to five seconds.
     wrongTimer=setTimeout(()=>{
       $('#wrongLight').classList.remove('on');
       $('#feedback').textContent='';
       wrongTimer=null;
     },5000);
   }else{
     locked=true;
     $('#feedback').textContent='You missed!';
     // Do not make the player wait five seconds after the second mistake.
     advanceTimer=setTimeout(nextQuestion,650);
   }
 }
}
function startGame(){deck=shuffle(files);index=0;score=0;loadQuestion();show('game')}
function startBgm(){const a=$('#bgm');a.volume=.35;if(a.paused)a.play().catch(()=>{});}
// Try autoplay on entry; browsers that block sound autoplay will start it on the user's first intro interaction.
window.addEventListener('load',()=>startBgm());
$('#intro').addEventListener('pointerdown',startBgm,{once:true});
$('#intro').addEventListener('keydown',startBgm,{once:true});
$('#introNext').addEventListener('click',()=>{startBgm();show('instructions');const v=$('#instructionVideo');v.currentTime=0;v.play().catch(()=>{});});
$('#startBtn').addEventListener('click',()=>{startBgm();startGame()});
document.querySelectorAll('.dept-btn').forEach(b=>b.addEventListener('click',()=>answer(b.dataset.dept)));
$('#replayBtn').addEventListener('click',()=>startGame());
for(const el of [$('#introNext'),$('#startBtn'),$('#replayBtn')])el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)$('#bgm').pause();else if(!$('#bgm').paused)startBgm();});
</script>
</body></html>
